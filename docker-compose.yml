services:
  postgres:
    image: postgres:17-alpine
    container_name: boundary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: boundary
      POSTGRES_USER: boundary
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-boundary}
    ports:
      - "5432:5432"
    volumes:
      - boundary-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boundary -d boundary"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  boundary-postgres-data:
