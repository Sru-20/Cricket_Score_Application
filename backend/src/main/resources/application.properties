server.port=8080
spring.application.name=boundary-score-api
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/boundary}
spring.datasource.username=${DATABASE_USERNAME:boundary}
spring.datasource.password=${DATABASE_PASSWORD:boundary}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:20}
spring.flyway.enabled=true
boundary.simulation.interval-ms=${SIMULATION_INTERVAL_MS:8000}
